<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghi công · Chùa An Liên</title>
<style>body{margin:0;background:#16201d;color:#ece2c6;font:15px/1.6 'Segoe UI',sans-serif;padding:24px 16px}main{max-width:820px;margin:auto}h1{color:#f3d48b}a{color:#e8c46e}pre{white-space:pre-wrap;background:#0f1513;border:1px solid #3a4a3f;border-radius:8px;padding:12px;font:13px/1.5 Consolas,monospace}</style>
<main><h1>Ghi công tác giả</h1><p>Chùa An Liên dùng các tượng 3D, nhân vật và âm thanh của nhiều tác giả theo giấy phép Creative Commons hoặc MIT. Xin tri ân các tác giả.</p><div id="list"></div></main>
<script>const files=[['Nhân vật người chơi · Microsoft Rocketbox · MIT','assets/chars/ready-made/rocketbox/CREDITS.md'],['Âm thanh, tụng kinh','assets/amb/CREDITS.md'],['Vườn tượng (thư viện 30 mẫu)','assets/sanctuary/library/CREDITS.md'],['Thượng điện','assets/sanctuary/diana/CREDITS.md'],['Tượng trong chánh điện','assets/sanctuary/statues/CREDITS.md'],['Nhân vật nhà sư, ni cô','assets/chars/ready-made/creator424-monk/CREDITS.md'],['','assets/chars/ready-made/buddhist-nun/CREDITS.md']];
(async()=>{const box=document.getElementById('list');for(const [t,f] of files){try{const r=await fetch(f);if(!r.ok)continue;const pre=document.createElement('pre');pre.textContent=await r.text();if(t){const h=document.createElement('h2');h.textContent=t;box.append(h);}box.append(pre);}catch{}}})();</script></html>
